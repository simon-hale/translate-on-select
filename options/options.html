<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="options.pageTitle">Translate on Select - 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>

  <body>
    <main class="page-shell">
      <header class="page-head">
        <h1 data-i18n="options.heading">扩展设置</h1>
        <p class="page-desc" data-i18n="options.heroText">管理模式、服务器地址和 API Key。</p>
        <div class="page-badges">
          <span class="page-badge">
            <span class="badge-label" data-i18n="options.currentModeLabel">当前模式</span>
            <strong id="modeBadge">自定义服务器</strong>
          </span>
          <span class="page-badge">
            <span class="badge-label" data-i18n="options.currentSourceLabel">当前来源</span>
            <strong id="brandBadge">Deepseek V4</strong>
          </span>
        </div>
      </header>

      <p class="mode-summary" id="modeSummary">当前为服务器模式。</p>

      <div class="sections">
        <section class="settings-section">
          <h2 data-i18n="options.generalTitle">基础设置</h2>

          <div class="field">
            <label class="field-label" for="uiLanguageSelect" data-i18n="menu.uiLanguageLabel">界面语言</label>
            <select id="uiLanguageSelect" data-i18n-aria-label="menu.uiLanguageLabel"></select>
          </div>

          <div class="field">
            <label class="field-label" for="modeSelect" data-i18n="options.modeLabel">工作模式</label>
            <select id="modeSelect" data-i18n-aria-label="options.modeLabel"></select>
          </div>
        </section>

        <section id="serverSection" class="settings-section" hidden>
          <h2 data-i18n="options.serverTitle">服务器</h2>

          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="server" data-i18n="options.serverUrlLabel">服务器 URL</label>
              <input
                id="server"
                type="text"
                placeholder="https://your-server.example.com/"
                autocomplete="url"
                spellcheck="false"
              />
            </div>

            <div class="field">
              <label class="field-label" for="HTTPMethods" data-i18n="options.requestMethodLabel">请求方法</label>
              <select id="HTTPMethods" data-i18n-aria-label="options.requestMethodLabel"></select>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="apiSelectServer" data-i18n="options.serverEndpointLabel">服务端点类型</label>
            <select id="apiSelectServer" data-i18n-aria-label="options.serverEndpointLabel"></select>
          </div>

          <div class="action-row">
            <button id="saveBtn-server" class="button primary" type="button" data-i18n="options.saveSettingsButton">保存配置</button>
            <button id="clearBtn-server" class="button secondary" type="button" data-i18n="options.clearButton">清空</button>
          </div>
        </section>

        <section id="apiSection" class="settings-section" hidden>
          <h2 data-i18n="options.apiTitle">API 品牌</h2>

          <div class="field">
            <label class="field-label" for="apiSelect" data-i18n="options.apiBrandLabel">当前品牌</label>
            <select id="apiSelect" data-i18n-aria-label="options.apiBrandLabel"></select>
          </div>
          <div class="field" id="deepseekModelField" hidden>
            <label class="field-label" for="deepseekModelSelect" data-i18n="options.deepseekModelLabel">Deepseek V4 Model</label>
            <select id="deepseekModelSelect" data-i18n-aria-label="options.deepseekModelLabel"></select>
          </div>
          <div class="field" id="deepseekStreamField" hidden>
            <label class="field-label" for="streamDeepseekSelect" data-i18n="menu.streamModeLabel">Deepseek 输出模式</label>
            <select id="streamDeepseekSelect" data-i18n-aria-label="menu.streamModeLabel"></select>
          </div>
        </section>

        <section id="deeplApiSection" class="settings-section" hidden>
          <h2 data-i18n="options.deeplTitle">DeepL</h2>

          <div class="field">
            <label class="field-label" for="apiKey-deepl" data-i18n="options.apiKeyLabel">API Key</label>
            <div class="input-action-wrap">
              <input
                id="apiKey-deepl"
                type="password"
                placeholder="DeepL-Auth-Key"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                class="input-visibility-toggle"
                type="button"
                data-target="apiKey-deepl"
                data-label-key="options.apiKeyLabel"
                aria-pressed="false"
              >
                显示
              </button>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="endpoint-deepl" data-i18n="options.endpointLabel">Endpoint</label>
            <select id="endpoint-deepl" data-i18n-aria-label="options.endpointLabel"></select>
          </div>

          <div class="action-row">
            <button id="saveBtn-deepl" class="button primary" type="button" data-i18n="options.saveSettingsButton">保存配置</button>
            <button id="clearBtn-deepl" class="button secondary" type="button" data-i18n="options.clearKeyButton">清空 Key</button>
          </div>
        </section>

        <section id="deepseekApiSection" class="settings-section" hidden>
          <h2 data-i18n="options.deepseekTitle">Deepseek</h2>

          <div class="field">
            <label class="field-label" for="apiKey-deepseek" data-i18n="options.apiKeyLabel">API Key</label>
            <div class="input-action-wrap">
              <input
                id="apiKey-deepseek"
                type="password"
                placeholder="Deepseek-Api-Key"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                class="input-visibility-toggle"
                type="button"
                data-target="apiKey-deepseek"
                data-label-key="options.apiKeyLabel"
                aria-pressed="false"
              >
                显示
              </button>
            </div>
          </div>

          <div class="action-row">
            <button id="saveBtn-deepseek" class="button primary" type="button" data-i18n="options.saveSettingsButton">保存配置</button>
            <button id="clearBtn-deepseek" class="button secondary" type="button" data-i18n="options.clearKeyButton">清空 Key</button>
          </div>
        </section>

        <section id="googleApiSection" class="settings-section" hidden>
          <h2 data-i18n="options.googleTitle">Google</h2>

          <p class="empty-state" data-i18n="options.notImplementedText">后续可在这里补充配置项。</p>
        </section>
      </div>
    </main>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="../shared/select.js"></script>
    <script src="options.js"></script>
  </body>
</html>
